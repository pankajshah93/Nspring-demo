
name: Deploy To Ubuntu

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true

    runs-on: self-hosted

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check Node Version
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Stop Old Application
        run: |
          APP_DIR="/home/ubuntu/node-demo"

          if [ -f "$APP_DIR/app.pid" ]; then
            PID=$(cat "$APP_DIR/app.pid")

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"

              for i in {1..10}; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                kill -9 "$PID"
              fi
            fi

            rm -f "$APP_DIR/app.pid"
          fi

      - name: Copy New Application
        run: |
          APP_DIR="/home/ubuntu/node-demo"

          mkdir -p "$APP_DIR"

          cp -r dist "$APP_DIR/"
          cp package.json "$APP_DIR/"
          cp package-lock.json "$APP_DIR/"

      - name: Install Production Dependencies
        run: |
          cd /home/ubuntu/node-demo
          npm ci --omit=dev

      - name: Start Application
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          cd /home/ubuntu/node-demo

          RUNNER_TRACKING_ID="" nohup env \
            PORT=3000 \
            APP_VERSION="$APP_VERSION" \
            node dist/server.js > app.log 2>&1 &

          echo $! > app.pid

      - name: Verify Deployment
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:3000/health; then
              echo "Deployment successful!"
              exit 0
            fi

            sleep 2
          done

          echo "Deployment failed!"
          cat /home/ubuntu/node-demo/app.log
          exit 1
